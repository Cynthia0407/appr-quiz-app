<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감정평가사 1차 기출학습</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Firestore 지원) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .option-btn { width: 100%; text-align: left; padding: 1.25rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; background-color: #ffffff; transition: all 0.2s; margin-bottom: 0.5rem; word-break: keep-all; line-height: 1.6; font-size: 0.95rem; }
        .option-btn:not(:disabled):hover { background-color: #f1f5f9; border-color: #cbd5e1; cursor: pointer; }
        .option-correct { background-color: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46 !important; font-weight: bold; }
        .option-wrong { background-color: #fff1f2 !important; border-color: #f43f5e !important; color: #9f1239 !important; font-weight: bold; text-decoration: line-through; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col text-slate-800">

    <!-- Header (오리지널 블루 스타일) -->
    <header class="bg-[#2c52b3] border-b border-indigo-800 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="font-bold text-white text-lg cursor-pointer" onclick="goHome()">감정평가사 1차 기출학습</h1>
            
            <div class="flex items-center gap-2">
                <button onclick="openCloudModal()" id="cloud-status-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors bg-white/10 border-white/20 text-white hover:bg-white/20">
                    <i id="cloud-status-icon" class="fa-solid fa-cloud text-indigo-200"></i>
                    <span id="cloud-status-text">오프라인</span>
                </button>
                <button onclick="goHome()" class="px-4 py-1.5 rounded-lg text-xs font-bold border border-white/30 text-white hover:bg-white/20 transition-colors">
                    홈으로
                </button>
            </div>
        </div>
    </header>

    <!-- Home View -->
    <main id="view-home" class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-8 mt-4">
        
        <div class="text-center sm:text-left flex flex-col items-center sm:items-start">
            <h2 class="font-bold text-2xl text-slate-800 mb-2">과목별 기출문제 풀이</h2>
            <p class="text-slate-500 text-sm">풀이할 과목과 모드를 선택해주세요.</p>
        </div>

        <div id="subject-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
            <!-- 과목 카드가 여기에 동적으로 생성됩니다 -->
        </div>
    </main>

    <!-- Quiz View -->
    <main id="view-quiz" class="hidden flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col mt-2">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span id="quiz-badge-mode" class="px-2 py-1 bg-rose-100 text-rose-700 text-[10px] font-bold rounded hidden">오답노트 모드</span>
                <span id="quiz-badge-year" class="px-2 py-1 bg-indigo-50 text-indigo-700 text-[10px] font-bold rounded">2020년 기출</span>
                <span id="quiz-badge-subject" class="px-2 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold rounded">과목명</span>
            </div>
            <div class="text-sm font-bold text-slate-500" id="quiz-progress-text">0 / 0</div>
        </div>
        
        <div class="w-full bg-slate-200 rounded-full h-2 mb-6">
            <div id="quiz-progress-bar" class="bg-[#2c52b3] h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-4">
            <h2 id="quiz-question" class="text-base sm:text-lg font-bold text-slate-800 leading-relaxed mb-6 whitespace-pre-wrap">문제 내용</h2>
            
            <div id="quiz-options" class="flex flex-col">
                <!-- 보기 항목들 -->
            </div>
        </div>

        <!-- Post-Answer Actions (이전 버튼 추가) -->
        <div id="quiz-actions" class="hidden flex flex-col gap-2 mt-2 pb-8 shrink-0">
            <button id="btn-scrap-toggle" onclick="toggleCurrentScrap()" class="w-full py-4 rounded-xl font-bold text-sm border transition-colors flex items-center justify-center gap-2"></button>
            <div class="flex gap-2 w-full">
                <button id="btn-prev-question" onclick="prevQuestion()" class="flex-1 py-4 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-200 transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> 이전
                </button>
                <button onclick="nextQuestion()" class="flex-[2] py-4 bg-[#2c52b3] text-white rounded-xl font-bold text-sm hover:bg-blue-800 transition-colors flex items-center justify-center gap-2 shadow-sm">
                    다음 문제 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
        
        <!-- Result Screen -->
        <div id="quiz-result" class="hidden flex-col items-center justify-center py-16">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-4xl mb-4"><i class="fa-solid fa-flag-checkered"></i></div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">학습 완료!</h2>
            <p class="text-slate-500 text-base mb-8" id="quiz-result-score">정답률: 0%</p>
            <div class="flex gap-3 w-full max-w-sm">
                <button onclick="goHome()" class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">홈으로</button>
                <button onclick="restartCurrentSession()" class="flex-1 py-3.5 bg-[#2c52b3] hover:bg-blue-800 text-white font-bold rounded-xl shadow-sm transition-colors">다시 풀기</button>
            </div>
        </div>
    </main>

    <!-- 진행률 초기화 확인 모달 -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fa-solid fa-rotate-right"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-lg mb-2">진행률 초기화</h3>
            <p class="text-sm text-slate-500 mb-6 break-keep">정말 <span id="confirm-subj-name" class="font-bold text-indigo-600"></span> 과목의 진행률을 초기화하시겠습니까?<br>(스크랩한 오답노트는 그대로 유지됩니다)</p>
            <div class="flex gap-2 w-full">
                <button onclick="closeConfirmModal()" class="flex-1 py-3.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors">취소</button>
                <button onclick="executeResetProgress()" class="flex-1 py-3.5 bg-rose-500 text-white font-bold rounded-xl hover:bg-rose-600 transition-colors shadow-sm">초기화</button>
            </div>
        </div>
    </div>

    <!-- 자체 토스트 알림 메시지창 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-xl text-sm font-bold shadow-lg transition-all duration-300 opacity-0 transform translate-y-4 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-indigo-400"></i>
        <span id="toast-msg">메시지</span>
    </div>

    <!-- Cloud Modal -->
    <div id="cloud-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800 text-lg"><i class="fa-solid fa-cloud text-[#2c52b3] mr-2"></i>클라우드 동기화 설정</h3>
                <button onclick="document.getElementById('cloud-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-xs text-slate-500 mb-5 bg-slate-50 p-3 rounded-lg leading-relaxed">동일한 스터디룸 코드와 Firebase(Firestore) 설정을 입력하면 PC와 스마트폰 간에 진행률 및 오답노트가 실시간으로 자동 저장·동기화됩니다.</p>
            
            <label class="block text-xs font-bold text-slate-700 mb-1.5">스터디룸 코드 (자유롭게 입력)</label>
            <input type="text" id="cloud-room-id" placeholder="예: cpa_2026_test" class="w-full border border-slate-300 rounded-xl p-3 text-sm mb-5 focus:outline-none focus:border-[#2c52b3] focus:ring-1 focus:ring-[#2c52b3]">
            
            <div class="flex items-center justify-between mb-1.5">
                <label class="block text-xs font-bold text-slate-700">Firebase 설정 (JSON)</label>
                <button onclick="document.getElementById('fb-config-box').classList.toggle('hidden')" class="text-[11px] text-[#2c52b3] font-bold hover:underline">⚙️ 설정 변경/확인</button>
            </div>
            <div id="fb-config-box" class="hidden mb-5">
                <textarea id="firebase-config-input" rows="5" placeholder='{"apiKey": "...", "projectId": "..."}' class="w-full border border-slate-300 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-[#2c52b3]"></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="saveCloudSettings()" class="flex-1 bg-[#2c52b3] text-white font-bold py-3.5 rounded-xl text-sm hover:bg-blue-800 transition-colors shadow-sm">연동 시작</button>
                <button id="btn-disconnect" onclick="disconnectCloud()" class="hidden px-5 bg-rose-50 text-rose-600 border border-rose-200 font-bold py-3.5 rounded-xl text-sm hover:bg-rose-100 transition-colors">연동 해제</button>
            </div>
        </div>
    </div>

    <!-- 외부 문제 데이터 연결 부분 -->
    <script src="quizData.js"></script>
    <script src="quizData_civil_law.js"></script>
    <script src="quizData_economics.js"></script>
    <script src="quizData_real_estate.js"></script>
    <script src="quizData_appraisal.js"></script>
    <script src="quizData_accounting.js"></script>
    
    <script>
        // --- 1. 앱 상태 및 초기화 ---
        window.quizData = window.quizData || {};
        
        // 유저가 파일에 const quizData = { ... } 로 작성했을 경우를 대비한 호환성 패치
        if (typeof quizData !== 'undefined') {
            for (let key in quizData) {
                window.quizData[key] = quizData[key];
            }
        }

        let allQuestions = {};
        
        function flattenData() {
            allQuestions = {};
            for (let subj in window.quizData) {
                window.quizData[subj].forEach(q => {
                    q.subject = subj;
                    allQuestions[q.id] = q;
                });
            }
        }

        let appState = {
            progress: {}, // { "민법": { currentIdx: 0, shuffledIds: ["id1", ...], correct: 0, wrong: 0, history: {"id1": 3} } }
            scrap: []     // ["id1", "id2"]
        };

        // 퀴즈 진행용 세션 변수
        let currentSubject = null;
        let isWrongMode = false;
        let sessionIds = [];
        let sessionIdx = 0;
        let sessionCorrect = 0;
        let sessionWrong = 0;
        
        let currentQuestionObj = null;
        let isAnswered = false;

        // 토스트 및 모달 관련 변수
        let subjectToReset = null;

        // --- 2. 클라우드 연동 로직 (Firestore) ---
        let roomId = '';
        let dbRef = null;
        let unsubscribe = null;

        const DEFAULT_ONION_CONFIG = {
            "apiKey": "AIzaSyCMcFSFT_iHYiMay8Bq6J23gvErssVLmVc",
            "authDomain": "study-tool-web.firebaseapp.com",
            "projectId": "study-tool-web"
        };

        window.addEventListener('DOMContentLoaded', () => {
            flattenData();
            loadLocalState();
            renderHome();
            initCloudSync();
        });

        function loadLocalState() {
            const stored = localStorage.getItem('cpa_mcq_state');
            if (stored) {
                try { appState = JSON.parse(stored); } catch(e) {}
            }
            if (!appState.progress) appState.progress = {};
            if (!appState.scrap) appState.scrap = [];
            
            // 기존 버전 호환성 패치 (history 객체 추가)
            for (let subj in appState.progress) {
                if (!appState.progress[subj].history) {
                    appState.progress[subj].history = {};
                }
            }
        }

        function saveLocalState() {
            localStorage.setItem('cpa_mcq_state', JSON.stringify(appState));
            syncToCloud();
        }

        function syncToCloud() {
            if (dbRef) {
                dbRef.set(appState, { merge: true }).catch(e => console.error(e));
            }
        }

        function parseFirebaseConfigInput(inputStr) {
            if (!inputStr) return null;
            try { return JSON.parse(inputStr); } catch (e) {}
            const match = inputStr.match(/\{[\s\S]*\}/);
            if (!match) return null;
            let objStr = match[0].replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":').replace(/,\s*([}\]])/g, '$1');
            try { return JSON.parse(objStr); } catch (e) { return null; }
        }

        function initCloudSync() {
            const savedRoom = localStorage.getItem('cpa_cloud_room');
            const savedConfigStr = localStorage.getItem('cpa_firebase_config');
            if (!savedRoom || !savedConfigStr) {
                updateCloudUI(false);
                return;
            }
            roomId = savedRoom;

            const configObj = parseFirebaseConfigInput(savedConfigStr);
            if (!configObj) return;

            try {
                if (window.firebase) {
                    if (!firebase.apps.length) firebase.initializeApp(configObj);
                    const db = firebase.firestore();
                    dbRef = db.collection('cpa_mcq_rooms').doc(roomId);

                    if(unsubscribe) unsubscribe();
                    unsubscribe = dbRef.onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.progress) appState.progress = data.progress;
                            if (data.scrap) appState.scrap = data.scrap;
                            
                            if (!document.getElementById('view-home').classList.contains('hidden')) renderHome();
                        } else {
                            syncToCloud();
                        }
                        updateCloudUI(true);
                    }, err => {
                        console.error(err);
                        updateCloudUI(false, "권한 오류");
                    });
                }
            } catch(err) {
                updateCloudUI(false, "설정 오류");
            }
        }

        function openCloudModal() {
            document.getElementById('cloud-room-id').value = localStorage.getItem('cpa_cloud_room') || '';
            document.getElementById('firebase-config-input').value = localStorage.getItem('cpa_firebase_config') || '';
            document.getElementById('cloud-modal').classList.remove('hidden');
        }

        function saveCloudSettings() {
            let room = document.getElementById('cloud-room-id').value.trim();
            let configStr = document.getElementById('firebase-config-input').value.trim();
            
            if (!room) {
                showToast("스터디룸 코드를 입력하세요.");
                return;
            }
            if (room === 'onion10') configStr = JSON.stringify(DEFAULT_ONION_CONFIG);
            else if (!configStr) {
                if (localStorage.getItem('cpa_firebase_config')) {
                    configStr = localStorage.getItem('cpa_firebase_config');
                } else {
                    showToast("Firebase 설정을 입력하세요.");
                    return;
                }
            }

            const configObj = parseFirebaseConfigInput(configStr);
            if (!configObj) {
                showToast("Firebase Config 형식이 올바르지 않습니다.");
                return;
            }

            localStorage.setItem('cpa_cloud_room', room);
            localStorage.setItem('cpa_firebase_config', JSON.stringify(configObj, null, 2));
            
            document.getElementById('cloud-modal').classList.add('hidden');
            initCloudSync();
            showToast("클라우드 연동이 설정되었습니다.");
        }

        function disconnectCloud() {
            if(unsubscribe) unsubscribe();
            dbRef = null;
            localStorage.removeItem('cpa_cloud_room');
            updateCloudUI(false);
            document.getElementById('cloud-modal').classList.add('hidden');
            showToast("클라우드 연동이 해제되었습니다.");
        }

        function updateCloudUI(isConnected, errMsg = "") {
            const btn = document.getElementById('cloud-status-btn');
            const icon = document.getElementById('cloud-status-icon');
            const text = document.getElementById('cloud-status-text');
            const disBtn = document.getElementById('btn-disconnect');
            
            if (isConnected) {
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors bg-emerald-500 border-emerald-600 text-white hover:bg-emerald-600";
                icon.className = "fa-solid fa-cloud text-emerald-100";
                text.className = "text-white";
                text.textContent = "동기화 중";
                disBtn.classList.remove('hidden');
            } else {
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors bg-white/10 border-white/20 text-white hover:bg-white/20";
                icon.className = "fa-solid fa-cloud text-indigo-200";
                text.className = "text-white";
                text.textContent = errMsg ? "오프라인 (오류)" : "오프라인";
                disBtn.classList.add('hidden');
            }
        }

        // --- 3. UI 네비게이션 및 홈 화면 ---
        function goHome() {
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-quiz').classList.add('hidden');
            flattenData();
            renderHome();
        }

        function renderHome() {
            const list = document.getElementById('subject-list');
            list.innerHTML = '';
            
            if (Object.keys(window.quizData).length === 0) {
                list.innerHTML = `
                <div class="col-span-full p-10 text-center text-slate-500 bg-white rounded-2xl border border-slate-200">
                    기출문제 데이터가 없습니다.<br>quizData.js 등의 파일을 연결해주세요.
                </div>`;
                return;
            }

            for (let subj in window.quizData) {
                const total = window.quizData[subj].length;
                const prog = appState.progress[subj];
                let solved = prog ? Math.min(prog.currentIdx, total) : 0;
                
                // 해당 과목의 오답노트(스크랩) 개수 계산
                const wrongCount = appState.scrap.filter(id => allQuestions[id] && allQuestions[id].subject === subj).length;

                list.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col gap-5">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-slate-800 text-xl mb-1">${subj}</h3>
                                <p class="text-sm text-slate-500 font-medium flex items-center gap-2">
                                    <span>총 ${total}문제 탑재</span>
                                    <span class="text-[#2c52b3] font-bold">(진행률: ${solved}/${total})</span>
                                </p>
                            </div>
                            ${solved > 0 ? `<button onclick="promptResetProgress('${subj}')" class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-colors flex items-center justify-center" title="진행률 초기화"><i class="fa-solid fa-rotate-right"></i></button>` : ''}
                        </div>
                        <div class="flex flex-col gap-3">
                            <button onclick="startQuiz('${subj}', false)" class="w-full py-3.5 bg-blue-50 text-[#2c52b3] font-bold rounded-xl hover:bg-blue-100 transition-colors">
                                전체 기출 풀기
                            </button>
                            <button onclick="startQuiz('${subj}', true)" class="w-full py-3.5 bg-rose-50 text-rose-600 font-bold rounded-xl hover:bg-rose-100 transition-colors flex justify-center items-center gap-2 ${wrongCount === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${wrongCount === 0 ? 'disabled' : ''}>
                                오답노트 풀기 <span class="bg-white text-rose-500 px-2.5 py-0.5 rounded-full text-xs shadow-sm">${wrongCount}</span>
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // --- 진행률 리셋 로직 ---
        function promptResetProgress(subj) {
            subjectToReset = subj;
            document.getElementById('confirm-subj-name').textContent = subj;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            subjectToReset = null;
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function executeResetProgress() {
            if(!subjectToReset) return;
            
            const ids = window.quizData[subjectToReset].map(q => q.id);
            appState.progress[subjectToReset] = {
                currentIdx: 0,
                shuffledIds: shuffleArray(ids),
                correct: 0,
                wrong: 0,
                history: {} // 문제 풀이 기록 초기화
            };
            saveLocalState();
            closeConfirmModal();
            renderHome();
            showToast(subjectToReset + ' 진행률이 초기화되었습니다.');
        }

        // --- 공통 토스트 알림 메시지 ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            if (!toast || !toastMsg) return;
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2500);
        }

        // --- 4. 퀴즈 진행 로직 ---
        function shuffleArray(array) {
            let curId = array.length, temp, randId;
            while (0 !== curId) {
                randId = Math.floor(Math.random() * curId);
                curId -= 1;
                temp = array[curId];
                array[curId] = array[randId];
                array[randId] = temp;
            }
            return array;
        }

        function startQuiz(subj, wrongMode) {
            currentSubject = subj;
            isWrongMode = wrongMode;
            
            if (isWrongMode) {
                // 오답노트 모드: 스크랩된 문제만 섞어서 출제 (진행률 저장 X)
                let targetIds = appState.scrap.filter(id => allQuestions[id] && allQuestions[id].subject === subj);
                if (targetIds.length === 0) return;
                
                sessionIds = shuffleArray([...targetIds]);
                sessionIdx = 0;
                sessionCorrect = 0;
                sessionWrong = 0;
                window.sessionHistory = {}; // 오답노트 세션 히스토리 초기화
                document.getElementById('quiz-badge-mode').classList.remove('hidden');
            } else {
                // 전체 기출 풀기 모드: 진행률 연동
                const total = window.quizData[subj].length;
                if (!appState.progress[subj] || appState.progress[subj].currentIdx >= total) {
                    const ids = window.quizData[subj].map(q => q.id);
                    appState.progress[subj] = {
                        currentIdx: 0,
                        shuffledIds: shuffleArray(ids),
                        correct: 0,
                        wrong: 0,
                        history: {}
                    };
                    saveLocalState();
                }
                
                // 이전 버전 호환성: history 객체가 없으면 생성
                if (!appState.progress[subj].history) {
                    appState.progress[subj].history = {};
                }
                
                sessionIds = appState.progress[subj].shuffledIds;
                sessionIdx = appState.progress[subj].currentIdx;
                sessionCorrect = 0; 
                sessionWrong = 0;
                document.getElementById('quiz-badge-mode').classList.add('hidden');
            }
            
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-actions').classList.add('hidden');
            
            renderQuestion();
        }

        function renderQuestion() {
            const total = sessionIds.length;
            
            if (sessionIdx >= total) {
                showResult();
                return;
            }

            isAnswered = false;
            const qId = sessionIds[sessionIdx];
            currentQuestionObj = allQuestions[qId];

            if (!currentQuestionObj) {
                // 문제 데이터를 찾을 수 없을 때 스킵
                if(!isWrongMode) {
                    appState.progress[currentSubject].currentIdx++;
                    saveLocalState();
                }
                sessionIdx++;
                renderQuestion();
                return;
            }

            document.getElementById('quiz-progress-text').textContent = `${sessionIdx + 1} / ${total}`;
            document.getElementById('quiz-progress-bar').style.width = `${((sessionIdx) / total) * 100}%`;
            
            document.getElementById('quiz-badge-year').textContent = `${currentQuestionObj.year}년 기출`;
            document.getElementById('quiz-badge-subject').textContent = currentQuestionObj.subject;
            document.getElementById('quiz-question').textContent = currentQuestionObj.question;

            const optContainer = document.getElementById('quiz-options');
            optContainer.innerHTML = '';
            currentQuestionObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = escapeHtml(opt);
                btn.onclick = () => selectOption(idx + 1, btn);
                optContainer.appendChild(btn);
            });

            // 이전 버튼 활성화/비활성화 처리
            const prevBtn = document.getElementById('btn-prev-question');
            if (prevBtn) {
                if (sessionIdx === 0) {
                    prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    prevBtn.disabled = true;
                } else {
                    prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    prevBtn.disabled = false;
                }
            }

            document.getElementById('quiz-actions').classList.add('hidden');
            updateScrapButtonUI();
            
            // 이미 푼 문제인지 히스토리 확인하여 복구
            let historyMap = isWrongMode ? window.sessionHistory : appState.progress[currentSubject].history;
            if (historyMap && historyMap[qId]) {
                const prevAnswer = historyMap[qId];
                isAnswered = true; // 강제 답변 완료 상태로 변경 (점수 중복 카운트 방지)
                
                const buttons = document.getElementById('quiz-options').children;
                const correctNum = currentQuestionObj.answer;
                const btnElement = buttons[prevAnswer - 1];
                
                const ansArray = Array.isArray(correctNum) ? correctNum : [correctNum];
                
                if (ansArray.includes(prevAnswer)) {
                    if (btnElement) btnElement.classList.add('option-correct');
                } else {
                    if (btnElement) btnElement.classList.add('option-wrong');
                    ansArray.forEach(ans => {
                        if(buttons[ans - 1]) buttons[ans - 1].classList.add('option-correct');
                    });
                }
                Array.from(buttons).forEach(b => b.disabled = true);
                document.getElementById('quiz-actions').classList.remove('hidden');
            }
        }

        function selectOption(selectedNum, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qId = currentQuestionObj.id;
            const correctNum = currentQuestionObj.answer;
            const buttons = document.getElementById('quiz-options').children;
            const ansArray = Array.isArray(correctNum) ? correctNum : [correctNum];

            if (ansArray.includes(selectedNum)) {
                btnElement.classList.add('option-correct');
                sessionCorrect++;
                if(!isWrongMode) appState.progress[currentSubject].correct++;
            } else {
                btnElement.classList.add('option-wrong');
                ansArray.forEach(ans => {
                    if(buttons[ans - 1]) buttons[ans - 1].classList.add('option-correct');
                });
                sessionWrong++;
                if(!isWrongMode) appState.progress[currentSubject].wrong++;
            }
            
            // 푼 내역을 히스토리에 저장
            if (isWrongMode) {
                if(!window.sessionHistory) window.sessionHistory = {};
                window.sessionHistory[qId] = selectedNum;
            } else {
                appState.progress[currentSubject].history[qId] = selectedNum;
                saveLocalState();
            }

            Array.from(buttons).forEach(b => b.disabled = true);
            document.getElementById('quiz-actions').classList.remove('hidden');
        }

        function prevQuestion() {
            if (sessionIdx > 0) {
                sessionIdx--;
                renderQuestion();
            } else {
                showToast('첫 번째 문제입니다.');
            }
        }

        function nextQuestion() {
            sessionIdx++;
            if (!isWrongMode) {
                // 뒤로 갔다가 다시 다음으로 넘길 때 진행률(currentIdx)이 후퇴하지 않도록 최댓값 유지
                if (sessionIdx > appState.progress[currentSubject].currentIdx) {
                    appState.progress[currentSubject].currentIdx = sessionIdx;
                }
                saveLocalState();
            }
            renderQuestion();
        }

        function showResult() {
            document.getElementById('quiz-badge-year').parentElement.classList.add('hidden');
            document.getElementById('quiz-question').classList.add('hidden');
            document.getElementById('quiz-options').classList.add('hidden');
            document.getElementById('quiz-actions').classList.add('hidden');
            
            const prog = appState.progress[currentSubject];
            const total = isWrongMode ? sessionIds.length : prog.shuffledIds.length;
            
            let correctCnt = isWrongMode ? sessionCorrect : prog.correct;
            let wrongCnt = isWrongMode ? sessionWrong : prog.wrong;
            const percent = total > 0 ? Math.round((correctCnt / total) * 100) : 0;
            
            document.getElementById('quiz-progress-bar').style.width = `100%`;
            document.getElementById('quiz-result-score').textContent = `정답률: ${percent}% (맞은 문제: ${correctCnt} / 틀린 문제: ${wrongCnt})`;
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('quiz-result').classList.add('flex');
        }

        function restartCurrentSession() {
            if (isWrongMode) {
                startQuiz(currentSubject, true);
            } else {
                const ids = window.quizData[currentSubject].map(q => q.id);
                appState.progress[currentSubject] = {
                    currentIdx: 0,
                    shuffledIds: shuffleArray(ids),
                    correct: 0,
                    wrong: 0,
                    history: {}
                };
                saveLocalState();
                
                document.getElementById('quiz-badge-year').parentElement.classList.remove('hidden');
                document.getElementById('quiz-question').classList.remove('hidden');
                document.getElementById('quiz-options').classList.remove('hidden');
                document.getElementById('quiz-result').classList.add('hidden');
                document.getElementById('quiz-result').classList.remove('flex');
                
                startQuiz(currentSubject, false);
            }
        }

        // --- 5. 오답/스크랩 노트 로직 ---
        function toggleCurrentScrap() {
            if (!currentQuestionObj) return;
            const id = currentQuestionObj.id;
            const idx = appState.scrap.indexOf(id);
            
            if (idx > -1) {
                appState.scrap.splice(idx, 1);
                showToast('오답노트에서 삭제되었습니다.');
            } else {
                appState.scrap.push(id);
                showToast('오답노트에 스크랩되었습니다.');
            }
            saveLocalState();
            updateScrapButtonUI();
        }

        function updateScrapButtonUI() {
            const btn = document.getElementById('btn-scrap-toggle');
            if (!currentQuestionObj) return;
            
            if (appState.scrap.includes(currentQuestionObj.id)) {
                btn.className = "w-full py-4 rounded-xl font-bold text-sm transition-colors flex items-center justify-center gap-2 bg-amber-50 text-amber-600 border border-amber-300 shadow-sm";
                btn.innerHTML = '<i class="fa-solid fa-star"></i> 스크랩 해제';
            } else {
                btn.className = "w-full py-4 rounded-xl font-bold text-sm transition-colors flex items-center justify-center gap-2 bg-white text-slate-600 border border-slate-300 hover:bg-slate-50 shadow-sm";
                btn.innerHTML = '<i class="fa-regular fa-star"></i> 오답노트 스크랩';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
